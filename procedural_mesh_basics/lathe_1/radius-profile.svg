<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title description">
  <title id="title">Radius profile and vase outline for radiusAt(t)</title>
  <desc id="description">Left: radius against normalized height t, with baseline, broad sine profile, and final radius. Right: the same radius mirrored about the Y axis to illustrate the vase side profile. The widest ring is near t equals 0.758.</desc>
  <rect width="1160" height="500" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#202b3b">
    <text x="40" y="30" font-size="21" font-weight="bold">How radiusAt(t) shapes the vase</text>
    <text x="40" y="53" font-size="14">r(t) = 1.4 + 2.4 sin(0.9 pi t) + 0.6 sin(3 pi t)</text>
    <text x="75" y="80" font-size="16" font-weight="bold">Radius versus normalized height</text>
    <text x="750" y="53" font-size="16" font-weight="bold">The radius becomes the side outline</text>
    <text x="75" y="411" font-size="13">t = 0 is the bottom; t = 1 is the top.</text>
    <text x="750" y="421" font-size="13">Mirrored profile about the Y axis (not a 3D render).</text>
    <text x="750" y="442" font-size="13">Outline only: the mesh has no caps or inner wall.</text>
  </g>
